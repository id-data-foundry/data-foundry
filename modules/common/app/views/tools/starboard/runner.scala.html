@(dataset: Dataset, fileId: Long, fileName: String, fileContents: String)

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Starboard Runner: @fileName</title>
        @Html(utils.rendering.PlaygroundBridgeUtil.BRIDGE_SCRIPT)
        <link href="@routes.Assets.versioned("vendor/starboard/starboard-notebook.css")" rel="stylesheet">
        <script src="@routes.Assets.versioned("javascripts/jquery.min.js")" type="text/javascript"></script>
        <style type="text/css">
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow-x: hidden;
            }
        </style>
    </head>
    <body>
        <script type="text/javascript">
            // Configure Starboard artifacts URL and initial content
            window.starboardArtifactsUrl = `@routes.Assets.versioned("vendor/starboard/")`;
            window.initialNotebookContent = @Html(play.libs.Json.stringify(play.libs.Json.toJson(fileContents)).replace("<", "\\u003c"));

            function extractNotebookSource() {
                try {
                    const nbEl = document.querySelector('starboard-notebook');
                    if (nbEl && nbEl.runtime && nbEl.runtime.exports && nbEl.runtime.exports.core) {
                        return nbEl.runtime.exports.core.notebookContentToText(nbEl.runtime.content);
                    }
                } catch (e) {
                    console.warn("Could not read directly from starboard runtime", e);
                }

                try {
                    $('.starboard-notebook-footer-content button:eq(0)').click();
                    let content = $('#starboard-source-modal-content').text();
                    if (content) {
                        content = content.replaceAll('\n\\\n', '\n\n');
                    }
                    setTimeout(function() {
                        $('.modal-dialog button:eq(3)').click();
                    }, 200);
                    return content;
                } catch (e) {
                    console.warn("Could not read from starboard source modal", e);
                }
                return null;
            }

            window.addEventListener('message', function(event) {
                if (!event.data || typeof event.data !== 'object') return;

                if (event.data.type === 'GET_NOTEBOOK_CONTENT') {
                    const content = extractNotebookSource();
                    window.parent.postMessage({
                        type: 'NOTEBOOK_CONTENT_RESPONSE',
                        requestId: event.data.requestId,
                        content: content
                    }, '*');
                }
            });

            window.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                    e.preventDefault();
                    window.parent.postMessage({
                        type: 'TRIGGER_SAVE'
                    }, '*');
                }
            });

            // Dynamically load starboard-notebook.js
            let script = document.createElement("script");
            script.src = "@routes.Assets.versioned("vendor/starboard/starboard-notebook.js")";
            document.body.appendChild(script);
        </script>
    </body>
</html>
