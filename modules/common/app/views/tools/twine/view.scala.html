@(contents: String, url: String, urlHTML: String, csrfToken: String)
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Loading the Twine editor...</title>
</head>
<body>

	Loading the Twine editor...

	<script type="text/javascript">
		(function(){
			window.localStorage.clear();
			window.localStorage.setItem("twee-import", @Html(play.libs.Json.stringify(play.libs.Json.toJson(contents)).replace("<", "\\u003c")));
			window.localStorage.setItem("twee-csrfToken", @Html(play.libs.Json.stringify(play.libs.Json.toJson(csrfToken)).replace("<", "\\u003c")));
			window.localStorage.setItem("twee-postUrl", @Html(play.libs.Json.stringify(play.libs.Json.toJson(url)).replace("<", "\\u003c")));
			window.localStorage.setItem("twee-postUrlHTML", @Html(play.libs.Json.stringify(play.libs.Json.toJson(urlHTML)).replace("<", "\\u003c")));
			window.location.href = "/assets/vendor/twine/index.html";
		})();
	</script>

</body>
</html>
