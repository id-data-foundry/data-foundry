@(dataset: Dataset, fileName: String, base64Content: String)

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@dataset.getName() - @fileName</title>
  <style>
    html, body, iframe {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      overflow: hidden;
      background-color: #fafcf9;
    }
  </style>
</head>
<body>
  <iframe id="sandboxedFrame"
          sandbox="allow-scripts allow-forms allow-modals allow-popups"
          allowfullscreen
          title="@fileName"></iframe>
  <script type="text/javascript">
    (function() {
      try {
        var b64 = "@base64Content";
        var raw = atob(b64);
        var bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) {
          bytes[i] = raw.charCodeAt(i);
        }
        var decoded = new TextDecoder("utf-8").decode(bytes);
        document.getElementById("sandboxedFrame").srcdoc = decoded;
      } catch (err) {
        console.error("Failed to render sandboxed tab:", err);
      }
    })();
  </script>
</body>
</html>
