@(dataset : Dataset, contentHtml : String)
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@dataset.getName()</title>
  @Html(utils.rendering.PlaygroundBridgeUtil.getBridgeScript())
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #2e382e;
      background-color: #fafcf9;
      margin: 0;
      padding: 2.5rem 1.5rem;
    }
    .markdown-body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border: 1px solid #e0e8e0;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #1b5e20;
      font-weight: 600;
    }
    h1 {
      border-bottom: 2px solid #a5d6a7;
      padding-bottom: 0.3em;
    }
    h2 {
      border-bottom: 1px solid #c8e6c9;
      padding-bottom: 0.3em;
    }
    a {
      color: #388e3c;
      text-decoration: none;
    }
    a:hover {
      color: #1b5e20;
      text-decoration: underline;
    }
    img { max-width: 100%; border-radius: 4px; }
    pre {
      background: #f1f8e9;
      padding: 16px;
      overflow: auto;
      border-radius: 6px;
      border-left: 4px solid #66bb6a;
    }
    code {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-size: 88%;
      border: 1px solid #c8e6c9;
    }
    pre code {
      background: transparent;
      padding: 0;
      border: none;
      color: #1b5e20;
    }
    table { border-collapse: collapse; width: 100%; margin: 1.5rem 0; }
    table th {
      background-color: #e8f5e9;
      color: #1b5e20;
      border: 1px solid #c8e6c9;
      padding: 8px 14px;
      font-weight: 600;
    }
    table td { border: 1px solid #c8e6c9; padding: 8px 14px; }
    table tr:nth-child(2n) { background-color: #f9fbf9; }
    blockquote {
      border-left: 4px solid #43a047;
      background: #e8f5e9;
      color: #2e7d32;
      margin: 1.5rem 0;
      padding: 0.75rem 1.25rem;
      border-radius: 0 6px 6px 0;
    }
    hr { height: 2px; padding: 0; margin: 24px 0; background-color: #c8e6c9; border: 0; }
  </style>
</head>
<body>
  <div class="markdown-body">
    @Html(contentHtml)
  </div>
</body>
</html>
