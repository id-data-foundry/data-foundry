# This is the main reference configuration file for the application.
# https://www.playframework.com/documentation/latest/ConfigFile

play.modules {
  enabled += "play.filters.cors.CORSModule"
  enabled += "play.filters.headers.SecurityHeadersModule"
  enabled += "play.filters.hosts.AllowedHostsModule"
  enabled += "play.filters.gzip.GzipFilterModule"
}

play.filters.headers {
  # frameOptions is set to null because Content-Security-Policy frame-ancestors 'self'
  # provides modern clickjacking protection across all browsers without breaking sandboxed iframes.
  frameOptions = null
  allowActionSpecificHeaders = true
}

play.filters.enabled += play.filters.cors.CORSFilter
play.filters.enabled += play.filters.headers.SecurityHeadersFilter
play.filters.disabled += play.filters.csrf.CSRFFilter

play.filters.csp {
  directives {
    default-src = "'self' 'unsafe-inline' 'unsafe-eval'"
    style-src = "'self' 'unsafe-inline'"
    img-src = "'self' 'unsafe-inline' data: *"
    font-src = "'self' data:"
    connect-src = "'self' https://api.fitbit.com/"
    child-src = "'self' https://www.youtube-nocookie.com"
    frame-ancestors = "'self'"
  }
}

play.filters.hosts {
  allowed = ["."]
}

play.filters.cors {
  pathPrefixes = ["/"]
  allowedOrigins = null  # Allows all origins including opaque 'null'
  allowedHttpMethods = ["GET", "POST", "PUT", "DELETE"]
  supportsCredentials = false
  preflightMaxAge = 3 days
}

pekko.http {
  parsing {
    max-uri-length = 16k
  }
}

# Error handler
play.http.errorHandler = "utils.ErrorHandler"

# Environment-agnostic session defaults (domain and secure are managed in application.conf)
play.http.session {
  maxAge = 43200000
  httpOnly = true
  sameSite = "lax"
}

# Language
play.i18n.langs = [ "en", "nl", "de" ]

# ERM
ebean.default = ["models.*"]

# Number of database connections
# See https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
fixedConnectionPool = 9

# Set Hikari to fixed size with health checks
play.db {
  prototype {
    hikaricp.minimumIdle = ${fixedConnectionPool}
    hikaricp.maximumPoolSize = ${fixedConnectionPool}
    hikaricp.connectionTestQuery = "SELECT 1"
    hikaricp.validationTimeout = 3000
    hikaricp.maxLifetime = 1800000
  }
}
jpa.default = defaultPersistenceUnit

# Job queue sized to HikariCP connection pool
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = ${fixedConnectionPool}
  }
}

# Long-running AI / LLM work (chatbot); kept separate so LLM latency cannot starve DB work
ai.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 16
  }
}

play.evolutions.enabled = true
#play.evolutions.autoApply = true

play.temporaryFile {
  reaper {
    enabled = true
    initialDelay = "5 minutes"
    interval = "30 seconds"
    olderThan = "30 minutes"
  }
}

# Upload file size limitation
play.http.parser.maxDiskBuffer = 30MB
play.http.parser.maxMemoryBuffer = 4MB
parsers.anyContent.maxLength = 30MB
parsers.MultipartFormData.maxLength = 30MB

# security.txt (RFC 9116)
df.securitytxt {
  contact = "mailto:security@data-foundry.net"
  expires = ""
  preferred-languages = "en, nl"
  policy = "https://github.com/id-data-foundry/data-foundry/blob/main/SECURITY.md"
  acknowledgments = "https://github.com/id-data-foundry/data-foundry/blob/main/SECURITY.md#hall-of-fame"
}
