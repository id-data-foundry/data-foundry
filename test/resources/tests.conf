include "application.conf"

# Test configuration for DataFoundry
ebean.default = ["models.*"]
play.ebean.generateEvolutionsScripts = false
play.evolutions.enabled = true
play.evolutions.db.default.autoApply = true
play.http.router = "common.Routes"

db.default.driver = org.h2.Driver
db.default.url = "jdbc:h2:mem:play;DB_CLOSE_DELAY=-1"
play.mailer.mock = true

# Mock keys for testing
df.base_url = "http://localhost:9000"
df.keys.v2.user.api = "test-api-key"
df.keys.v2.multi.api = "test-api-key"
df.keys.project = "test-project-secret"
df.keys.registration = ["test-access-code"]